# grok CLI config — copy to ~/.grok/config.toml
# Points to glm52-vllm-pd (vLLM PD disaggregated, 256K context).
# This is a DIFFERENT deployment from glm52-2tp8 (sglang, 512K context).
#
# Verified 2026-07-17: POST https://glm52-vllm-pd.jmpti.woa.com/v1/responses -> 200.
# Backend: vllm-pd-proxy -> vllm-prefill/vllm-decode (PD disaggregated), model glm-5.2.
# MAX_MODEL_LEN on the vllm pod = 262144, so context_window is set to match.

[models]
default = "glm52-vllm-pd"

[model.glm52-vllm-pd]
model = "glm-5.2"
base_url = "https://glm52-vllm-pd.jmpti.woa.com/v1"
api_backend = "responses"
api_key = "${GROK_API_KEY}"
context_window = 262144
temperature = 0.7
top_p = 0.95

# Skills/rules/agents are synced into ~/.grok/{skills,rules,agents}/ by `teamai pull`.
# Grok scans ~/.grok/skills/ by default, so no [skills] paths override is needed.
#
# Headless usage: grok is a TUI app requiring a TTY.
# Use `grok -p "prompt"` or `grok --single "prompt"` for non-interactive single-turn.
