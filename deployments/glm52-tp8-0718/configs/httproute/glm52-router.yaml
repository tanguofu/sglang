apiVersion: v1
kind: Pod
metadata:
  labels:
    app: glm52-router
  name: glm52-router
  namespace: kube-system
spec:
  hostNetwork: true
  nodeName: node-21.151.225.172
  restartPolicy: Never
  nodeSelector:
    workload: sglang-1pd-B-group
  tolerations:
  - key: dedicated
    value: sglang-1pd-B-group
    effect: NoSchedule
    operator: Equal
  containers:
  - name: router
    image: mirrors.tencent.com/ti-platform/sglang-glm52-308x-pd-router:responses-0715
    imagePullPolicy: IfNotPresent
    ports:
    - name: http
      containerPort: 30002
      hostPort: 30002
    command: [/bin/bash, -c]
    args:
    - |
      set -euo pipefail
      exec python3 -m sglang_router.launch_router \
        --pd-disaggregation \
        --prefill http://21.151.225.152:30000 \
        --decode http://21.151.225.172:30000 \
        --host 0.0.0.0 --port 30002 \
        --prometheus-port 19096 \
        --model-path /data/model/glm52-fp8 \
        --log-level info
    env:
    - {name: PYTHONUNBUFFERED, value: "1"}
    volumeMounts:
    - {name: data, mountPath: /data}
    - {name: shm, mountPath: /dev/shm}
  volumes:
  - {name: data, hostPath: {path: /data, type: Directory}}
  - {name: shm, emptyDir: {medium: Memory, sizeLimit: 64Gi}}
