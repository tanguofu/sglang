# Source: sglang-glm52-308x/templates/sglang-router.yaml
# SGLang Router — cache_aware prefix-aware load balancer across TP8 instances
# Routes requests to the worker with the highest prefix match (radix cache optimization)
# Launches via: python3 -m sglang_router.launch_router --worker-urls ... --policy cache_aware
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-glm52-2tp8-router
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sglang-glm52-308x
    app.kubernetes.io/instance: sglang-glm52-2tp8
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: sglang-glm52-308x-0.1.0
    app: sglang
    accelerator: amd-gpu
    app: sglang-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sglang-glm52-308x
        app.kubernetes.io/instance: sglang-glm52-2tp8
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: sglang-glm52-308x-0.1.0
        app: sglang
        accelerator: amd-gpu
        app: sglang-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: tencent-registry
      nodeSelector:
        accelerator: amd-gpu
      tolerations:
        - key: dedicated
          operator: Equal
          value: sglang-2tp8
          effect: NoSchedule
        - operator: Exists
      terminationGracePeriodSeconds: 30
      containers:
        - name: router
          image: "mirrors.tencent.com/ti-platform/sglang-glm52-308x-pd-router:messages-0717c"
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "sglang_router.launch_router"]
          args:
            - --worker-urls
            - "http://21.234.170.103:30000"
            - "http://21.234.170.38:30000"
            - --policy
            - "cache_aware"
            - --host
            - "0.0.0.0"
            - --port
            - "30001"
            - --cache-threshold
            - "0.5"
            - --balance-abs-threshold
            - "32"
            - --balance-rel-threshold
            - "1.5"
          ports:
            - name: http
              containerPort: 30001
              protocol: TCP
          resources:
            requests:
              cpu: 2
              memory: 4Gi
            limits:
              cpu: 4
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
