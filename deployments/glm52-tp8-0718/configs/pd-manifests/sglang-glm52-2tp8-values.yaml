  failureThreshold: 10
  httpGet:
    path: /health
    port: 30000
  initialDelaySeconds: 120
  periodSeconds: 30
  timeoutSeconds: 10
replicas: 2
rocmQuickReduceQuantization: NONE
router:
  balanceAbsThreshold: 1
  balanceRelThreshold: 1.2
  cacheThreshold: 0.2
