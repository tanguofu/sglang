# GLM-5.2 2tp8 merged chart values (W1 + W2, replicas=2)
# Synced 2026-07-23: Benchmark-optimized parameters aligned with 1tp8 reference.
# Changes from previous revision:
#   - tag: xgmi-opt-0716d → fix-eagle-coredump-v3 (NCCL deadlock fix)
#   - sglang.cudaGraphBackendPrefill: breakable → tc_piecewise (ROCm BCG invalid)
#   - sglang.hicacheRatio: 4 → 2 (avoid DSA indexer host memory OOM)
#   - eaglePatch.enabled: true → false (PR #31478 baked into fix-eagle-coredump-v3)
#   - Added podAnnotations + imagePullSecrets (reference cluster config)
# 2026-07-23 benchmark alignment (P0+P1+P2):
#   P0: memFraction 0.75→0.88, cudaGraphBsDecode removed 20/24/32, cudaGraphMaxBsDecode 32→16,
#       cudaGraphBackendPrefill tc_piecewise (already set), enableMixedChunk true→false (EAGLE mutex)
#   P1: chunkedPrefillSize 16384→32768, prefillMaxRequests 8→32, scheduleConservativeness 1→0.5,
#       watchdogTimeout 1200→3600, hicacheRatio 2 (already set), hicacheWritePolicy write_back→write_through_selective
#   P2: maxRunningRequests 48→32 (concurrency convergence with prefillMaxRequests)
aitersTunedGemm:
  configMapName: aiters-tuned-gemm
  enabled: true
eaglePatch:
  enabled: false
gateway:
  enabled: true
  gatewayName: eg-tke
  gatewayNamespace: ti-cloud
  hostname: glm52-2tp8.jmpti.woa.com
  httpsSectionName: https-glm52-2tp8
  lbAddress: 21.162.215.14
hostNetwork: true
image: mirrors.tencent.com/ti-platform/sglang-glm52-308x
imagePullSecret: ""
imagePullSecrets:
- name: tencent-registry
- name: tencent-mirror-secret
livenessProbe:
  failureThreshold: 5
  httpGet:
    path: /health
    port: 30000
  initialDelaySeconds: 2400
  periodSeconds: 60
  timeoutSeconds: 10
llmDRouter:
  enabled: false
namespace: kube-system
nodeName: ""
nodeSelector:
  accelerator: amd-gpu
  sglang-model: ready
podAnnotations:
