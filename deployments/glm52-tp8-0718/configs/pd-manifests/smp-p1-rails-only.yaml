spec:
  template:
    spec:
      containers:
      - name: vllm-prefill
        env:
        - name: PD_ROLE
          value: "prefill"
        - name: MODEL_PATH
          value: "/data/model/glm52-fp8"
        - name: SERVED_MODEL_NAME
          value: "glm-5.2"
        - name: API_KEY
          value: "${ANTHROPIC_AUTH_TOKEN}"
        - name: PORT
          value: "8000"
        - name: PEER_IP
          value: "21.234.170.32"
        - name: TENSOR_PARALLEL_SIZE
          value: "8"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.85"
        - name: MAX_MODEL_LEN
          value: "262144"
        - name: HIP_VISIBLE_DEVICES
          value: "0,1,2,3,4,5,6,7"
        - name: PYTORCH_ROCM_ARCH
          value: "gfx942"
        - name: NCCL_IB_HCA
          value: "bnxt_re"
        - name: NCCL_NET_GDR_LEVEL
          value: "0"
        - name: NCCL_SOCKET_IFNAME
          value: "bond0"
        - name: NCCL_DEBUG
          value: "INFO"
        - name: VLLM_ROCM_USE_AITER
          value: "1"
        - name: NCCL_IB_TIMEOUT
          value: "23"
        - name: NCCL_IB_RETRY_CNT
          value: "7"
        - name: NCCL_P2P_DISABLE
          value: "0"
        - name: UCX_MAX_EAGER_RAILS
          value: "4"
        - name: UCX_MAX_RNDV_RAILS
          value: "4"
