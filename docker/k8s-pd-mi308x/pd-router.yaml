apiVersion: v1
kind: Pod
metadata:
  labels:
    app: pd-router
    pd-role: router
  name: pd-router-172
  namespace: kube-system
spec:
  containers:
  - args:
    - "set -euo pipefail\necho \"=== SGLang PD Router (api-fix-0720, 3 APIs) ===\"\
      \nexec python3 -m sglang_router.launch_router \\\n  --pd-disaggregation \\\n\
      \  --prefill http://21.151.225.144:30000 8998 \\\n  --decode http://21.151.225.132:30000\
      \ \\\n  --host 0.0.0.0 --port 30001 \\\n  --prometheus-port 19096 \\\n  --model-path\
      \ /data/model/glm52-fp8 \\\n  --health-check-timeout-secs 60 \\\n  --health-check-interval-secs\
      \ 30 \\\n  --health-failure-threshold 10 \\\n  --health-success-threshold 2\
      \ \\\n  --cb-timeout-duration-secs 300 \\\n  --log-level info\n"
    command:
    - /bin/bash
    - -c
    env:
    - name: PYTHONUNBUFFERED
      value: '1'
    image: mirrors.tencent.com/ti-platform/sglang-glm52-308x-pd-router:api-fix-0720
    imagePullPolicy: Always
    name: router
    resources:
      limits:
        memory: 8Gi
      requests:
        cpu: '4'
        memory: 4Gi
    securityContext:
      capabilities:
        add:
        - SYS_PTRACE
        - IPC_LOCK
        - NET_ADMIN
        drop:
        - ALL
      privileged: true
      seccompProfile:
        type: Unconfined
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /data
      name: data
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-4xdb4
      readOnly: true
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  hostNetwork: true
  nodeName: node-21.151.225.172
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
  - operator: Exists
  volumes:
  - hostPath:
      path: /data
      type: Directory
    name: data
  - name: kube-api-access-4xdb4
    projected:
      defaultMode: 420
      sources:
      - serviceAccountToken:
          expirationSeconds: 3607
          path: token
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: kube-root-ca.crt
      - downwardAPI:
          items:
          - fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
            path: namespace
