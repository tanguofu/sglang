apiVersion: v1
kind: Pod
metadata:
  annotations:
    meta.helm.sh/release-name: sglang-1p1d
    meta.helm.sh/release-namespace: kube-system
  labels:
    app: pd-prefill-144
    app.kubernetes.io/managed-by: Helm
    pd-role: prefill
  name: pd-prefill-144
  namespace: kube-system
spec:
  containers:
  - args:
    - "set -euo pipefail\n# Copy verified GDR engine.so (respects MC_DISABLE_HIP_TRANSPORT=1,\
      \ supports HIP dmabuf).\n# Do NOT patch conn.py — the container's original conn.py\
      \ works correctly;\n# patching causes req_has_disagg_prefill_dp_rank TypeError.\n\
      if [ -f /data/mooncake-patched/engine.cpython-310-x86_64-linux-gnu.so ]; then\n\
      \  cp /data/mooncake-patched/engine.cpython-310-x86_64-linux-gnu.so \\\n   \
      \  /opt/venv/lib/python3.10/site-packages/mooncake/engine.cpython-310-x86_64-linux-gnu.so\n\
      \  echo \"Copied verified GDR engine.so from /data/mooncake-patched/\"\nelse\n\
      \  echo \"ERROR: /data/mooncake-patched/engine.so not found!\" >&2\n  exit 1\n\
      fi\necho \"=== GLM-5.2 PREFILL (MI308X, GDR via HIP dmabuf) ===\"\nexec python3\
      \ -m sglang.launch_server \\\n  --model-path /data/model/glm52-fp8 \\\n  --model-impl\
      \ sglang --served-model-name glm-5.2 \\\n  --tp-size 8 --pp-size 1 --trust-remote-code\
      \ \\\n  --host 0.0.0.0 --port 30000 \\\n  --context-length 1048576 \\\n  --tool-call-parser\
      \ glm47 --reasoning-parser glm45 \\\n  --mem-fraction-static 0.90 \\\n  --attention-backend\
      \ dsa --dsa-prefill-backend tilelang --dsa-decode-backend tilelang \\\n  --enable-aiter-allreduce-fusion\
      \ \\\n  --chunked-prefill-size 32768 --enable-fused-qk-norm-rope \\\n  --schedule-conservativeness\
      \ 1.0 \\\n  --prefill-max-requests 32 --max-prefill-tokens 32768 \\\n  --kv-cache-dtype\
      \ fp8_e4m3 --disable-prefill-cuda-graph --disable-decode-cuda-graph \\\n  --max-running-requests\
      \ 32 \\\n  --disaggregation-mode prefill --disaggregation-transfer-backend mooncake\
      \ \\\n  --disaggregation-ib-device '{\"0\":\"bnxt_re_bond0\",\"1\":\"bnxt_re_bond1\"\
      ,\"2\":\"bnxt_re_bond2\",\"3\":\"bnxt_re_bond3\",\"4\":\"bnxt_re_bond4\",\"\
      5\":\"bnxt_re_bond5\",\"6\":\"bnxt_re_bond6\",\"7\":\"bnxt_re_bond7\"}' \\\n\
      \  --disaggregation-bootstrap-port 8998 \\\n  --num-reserved-decode-tokens 1024\
      \ \\\n  --enable-metrics --skip-server-warmup \\\n  --watchdog-timeout 3600\
      \ --log-level info\n"
    command:
    - /bin/bash
    - -c
    env:
    - name: SGLANG_HOST_IP
      value: 21.151.225.144
    - name: MOONCAKE_PROTOCOL
      value: rdma
    - name: MC_GID_INDEX
      value: '3'
    - name: MC_DISABLE_HIP_TRANSPORT
      value: '1'
    - name: HIP_VISIBLE_DEVICES
      value: 0,1,2,3,4,5,6,7
    - name: NCCL_DEBUG
      value: WARN
    - name: NCCL_IB_GID_INDEX
      value: '3'
    - name: NCCL_CUMEM_ENABLE
      value: '0'
    - name: NCCL_MIN_NCHANNELS
      value: '112'
    - name: NCCL_NVLS_ENABLE
      value: '0'
    - name: HSA_ENABLE_SDMA
      value: '0'
    - name: HIP_FORCE_DEV_KERNARG
      value: '1'
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: expandable_segments:True
    - name: PYTORCH_ROCM_ARCH
      value: gfx942
    - name: ROCM_QUICK_REDUCE_QUANTIZATION
      value: INT8
    - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
      value: '1'
    - name: SGLANG_DISABLE_CUDNN_CHECK
      value: '1'
    - name: SGLANG_ENABLE_PCG_DSV2_DUAL_STREAM
      value: '1'
    - name: SGLANG_INT4_WEIGHT
      value: '0'
    - name: SGLANG_MOE_PADDING
      value: '1'
    - name: SGLANG_ROCM_DISABLE_LINEARQUANT
      value: '0'
    - name: SGLANG_ROCM_FUSED_DECODE_MLA
      value: '1'
    - name: SGLANG_SET_CPU_AFFINITY
      value: '1'
    - name: SGLANG_USE_AITER
      value: '1'
    - name: SGLANG_USE_ROCM700A
      value: '1'
    - name: SGLANG_OPT_USE_TOPK_V2
      value: '0'
    image: mirrors.tencent.com/ti-platform/sglang-glm52-308x:fix-eagle-coredump-v3
    imagePullPolicy: Always
    name: sglang
    resources:
      limits:
        amd.com/gpu: '8'
      requests:
        amd.com/gpu: '8'
        cpu: '360'
        memory: 2100Gi
    securityContext:
      allowPrivilegeEscalation: true
      privileged: true
      readOnlyRootFilesystem: false
      seccompProfile:
        type: Unconfined
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /dev/shm
      name: shm
    - mountPath: /dev/infiniband
      name: dev-infiniband
    - mountPath: /dev/kfd
      name: dev-kfd
    - mountPath: /dev/dri
      name: dev-dri
    - mountPath: /data
      name: data
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-wxvd6
      readOnly: true
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  hostIPC: true
  hostNetwork: true
  hostPID: true
  nodeName: node-21.151.225.144
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
  - operator: Exists
  volumes:
  - emptyDir:
      medium: Memory
      sizeLimit: 64Gi
    name: shm
  - hostPath:
      path: /dev/infiniband
      type: Directory
    name: dev-infiniband
  - hostPath:
      path: /dev/kfd
      type: CharDevice
    name: dev-kfd
  - hostPath:
      path: /dev/dri
      type: Directory
    name: dev-dri
  - hostPath:
      path: /data
      type: Directory
    name: data
  - name: kube-api-access-wxvd6
    projected:
      defaultMode: 420
      sources:
      - serviceAccountToken:
          expirationSeconds: 3607
          path: token
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: kube-root-ca.crt
      - downwardAPI:
          items:
          - fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
            path: namespace
