apiVersion: v1
kind: Pod
metadata:
  name: vllm-pd-proxy
  namespace: kube-system
  labels:
    app: vllm-pd
    role: proxy
spec:
  hostNetwork: true
  nodeName: node-21.234.170.19
  restartPolicy: Never
  containers:
    - name: proxy
      image: mirrors.tencent.com/ti-platform/vllm-glm52-308x-pd:latest
      imagePullPolicy: Always
      command: ["python3", "/disagg_proxy.py"]
      args:
        - "--model"
        - "glm-5.2"
        - "--prefill"
        - "21.234.170.19:8000"
        - "--decode"
        - "21.234.170.32:8000"
        - "--port"
        - "9000"
      env:
        - name: OPENAI_API_KEY
          value: sk-46faecc9d0bc4dcd9db6a15c73ae91c8
      ports:
        - name: http
          containerPort: 9000
          hostPort: 9000
