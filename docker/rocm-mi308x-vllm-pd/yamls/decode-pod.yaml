apiVersion: v1
kind: Pod
metadata:
  name: vllm-decode
  namespace: kube-system
  labels:
    app: vllm-pd
    role: decode
spec:
  hostNetwork: true
  nodeName: node-21.234.170.32
  restartPolicy: Never
  containers:
    - name: vllm-decode
      image: mirrors.tencent.com/ti-platform/vllm-glm52-308x-pd:latest
      imagePullPolicy: Always
      env:
        - name: PD_ROLE
          value: "decode"
        - name: MODEL_PATH
          value: /data/model/glm52-fp8
        - name: SERVED_MODEL_NAME
          value: glm-5.2
        - name: API_KEY
          value: sk-46faecc9d0bc4dcd9db6a15c73ae91c8
        - name: PORT
          value: "13000"
        - name: HOST_IP
          value: 21.234.170.32
        - name: PEER_IP
          value: 21.234.170.19
        - name: TENSOR_PARALLEL_SIZE
          value: "8"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.90"
        - name: MAX_MODEL_LEN
          value: "1048576"
        - name: HIP_VISIBLE_DEVICES
          value: "0,1,2,3,4,5,6,7"
        - name: PYTORCH_ROCM_ARCH
          value: gfx942
        - name: UCX_TLS
          value: "rc_verbs,cuda_copy,cuda_ipc,tcp,self"
        - name: UCX_NET_DEVICES
          value: "bnxt_re_bond0:1"
        - name: UCX_IB_TLS
          value: "rc_verbs"
        - name: NCCL_IB_HCA
          value: bnxt_re
        - name: NCCL_NET_GDR_LEVEL
          value: "0"
        - name: NCCL_SOCKET_IFNAME
          value: bond0
        - name: HSA_ENABLE_SDMA
          value: "0"
        - name: HIP_FORCE_DEV_KERNARG
          value: "1"
        - name: HSA_NO_SCRATCH_RECLAIM
          value: "1"
          value: "expandable_segments:True"
        - name: NCCL_DEBUG
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: ""
          value: INFO
      securityContext:
        privileged: true
        capabilities:
          add: ["SYS_PTRACE"]
          drop: ["ALL"]
        seccompProfile:
          type: Unconfined
      ports:
        - name: http
          containerPort: 13000
          hostPort: 13000
      volumeMounts:
        - name: data
          mountPath: /data
        - name: dev-kfd
          mountPath: /dev/kfd
        - name: dev-dri
          mountPath: /dev/dri
        - name: ib
          mountPath: /dev/infiniband
        - name: shm
          mountPath: /dev/shm
        - name: sys
          mountPath: /sys
  volumes:
    - name: data
      hostPath:
        path: /data
        type: Directory
    - name: dev-kfd
      hostPath:
        path: /dev/kfd
        type: CharDevice
    - name: dev-dri
      hostPath:
        path: /dev/dri
        type: Directory
    - name: ib
      hostPath:
        path: /dev/infiniband
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 256Gi
    - name: sys
      hostPath:
        path: /sys
        type: Directory
