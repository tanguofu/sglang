# PD Router gateway: serverless Service + EndpointSlice + HTTPRoute
# hostNetwork pods don't get Service endpoints in TKE ENI mode,
# so we use a selector-less Service + manual EndpointSlice.
---
apiVersion: v1
kind: Service
metadata:
  name: pd-router-zw
  namespace: kube-system
  labels:
    app: pd-router
    pd-role: router
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 13002
      targetPort: 13002
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pd-router-zw
  namespace: kube-system
  labels:
    kubernetes.io/service-name: pd-router-zw
    app: pd-router
spec:
  addressType: IPv4
  ports:
    - name: http
      port: 13002
      protocol: TCP
  endpoints:
    - addresses:
        - "21.234.170.103"
      conditions:
        ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pd-router-zw
  namespace: kube-system
  labels:
    app: pd-router
spec:
  hostnames:
    - "glm52-pd-test.jmpti.woa.com"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-tke
      namespace: ti-cloud
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: pd-router-zw
          namespace: kube-system
          port: 13002
          weight: 1
