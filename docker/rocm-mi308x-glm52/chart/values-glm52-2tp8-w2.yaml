# SGLang GLM-5.2 2tp8 deployment — worker 2 (no router, no gateway)
# Usage:
#   helm install sglang-glm52-2tp8-w2 .../chart/ -f values-glm52-2tp8-w2.yaml
#
# Topology:
#   - sglang-glm52-2tp8    on node-21.151.225.152 (worker + router + gateway) — see values-glm52-2tp8.yaml
#   - sglang-glm52-2tp8-w2 on node-21.151.225.172 (this file, worker only)
#
# History:
#   2026-07-18: OOM fix — memFraction 0.88→0.75, prefillMaxRequests 32→4,
#               chunkedPrefillSize 32768→16384, scheduleConservativeness 0.5→1.0
#   2026-07-19: HiCache fix — write_through→write_back (fixes host cache load-back=0),
#               hicacheRatio 1→8 (host cache 547K→3.96M tokens/rank, ~1.4 TB total)
#               helm drift sync — watchdogTimeout 3600→1200, nodeName .38→.172
#   2026-07-19: hicacheRatio 8→4 — keep parity with worker 1 (which hit NUMA 1 OOM
#               at ratio=8). w2 could run ratio=8 (NUMA spread evenly), but lower
#               ratio reduces memory pressure and is sufficient for the workload.

# ---------------------------------------------------------------------------
# Image — same as worker 1
# ---------------------------------------------------------------------------
image: mirrors.tencent.com/ti-platform/sglang-glm52-308x
tag: xgmi-opt-0716d

# ---------------------------------------------------------------------------
# Worker placement — pin to 172 (secondary, worker only)
# ---------------------------------------------------------------------------
nodeName: node-21.151.225.172
replicas: 1

# ---------------------------------------------------------------------------
# SGLang server parameters — OOM fix (2026-07-18) + HiCache fix (2026-07-19)
# ---------------------------------------------------------------------------
sglang:
  contextLength: "524288"          # 512K (chart default is 1M, reduced for stability)
  memFractionStatic: 0.75          # OOM fix: was 0.88, left ~2.5GB/rank activation room
  chunkedPrefillSize: 16384        # OOM fix: was 32768, smaller chunks = less peak activation
  prefillMaxRequests: 4            # OOM fix: was 32, limit concurrent prefills to bound activation mem
  scheduleConservativeness: 1.0    # OOM fix: was 0.5, more conservative scheduling
  hicacheRatio: 4                  # HiCache: was 1→8, now 4 (parity with w1, less memory pressure)
  hicacheWritePolicy: write_back   # HiCache fix: was write_through, fixes host load-back=0
  watchdogTimeout: 1200            # fail faster on stuck detokenizer (chart default 3600)

# ---------------------------------------------------------------------------
# Router — DISABLED on worker 2 (router lives on worker 1)
# ---------------------------------------------------------------------------
router:
  enabled: false

# ---------------------------------------------------------------------------
# llm-d Router — DISABLED
# ---------------------------------------------------------------------------
llmDRouter:
  enabled: false

# ---------------------------------------------------------------------------
# Envoy Gateway — DISABLED on worker 2 (gateway lives on worker 1)
# ---------------------------------------------------------------------------
gateway:
  enabled: false
