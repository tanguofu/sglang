{{- if .Values.llmDRouter.enabled }}
# llm-d Router — EPP + Envoy as sidecars in the SGLang StatefulSet
#
# Replaces sgl-model-gateway router. Uses llm-d's file-discovery plugin to
# discover external SGLang instances (no InferencePool CRD required).
#
# Architecture:
#   Client → Envoy (:30001, sidecar in SGLang pod) → ext_proc → EPP (:9002)
#        → EPP picks endpoint from endpoints.yaml → Envoy forwards via ORIGINAL_DST
#
# EPP scorers (same as llm-d optimized-baseline):
#   prefix-cache-scorer (weight 3) — cache-aware prefix routing
#   queue-scorer (weight 2)        — load balancing by queue depth
#   kv-cache-utilization-scorer (weight 2) — KV cache awareness
#   no-hit-lru-scorer (weight 2)   — LRU for cache-miss requests
#
# Two environments:
#   TEST:  4x GZ SGLang instances
#   PROD:  2x ZW SGLang instances (configured via values-prod.yaml)
---
# ConfigMap: EPP plugin configuration + endpoints file (file-discovery reads this)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-llm-d-epp-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sglang.labels" . | nindent 4 }}
data:
  endpoints.yaml: |
    endpoints:
    {{- range .Values.llmDRouter.endpoints }}
      - name: {{ .name }}
        address: {{ .address }}
        port: "{{ .port }}"
        labels:
          model: {{ $.Values.model.servedName }}
          llm-d.ai/engine-type: sglang
    {{- end }}
  config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - name: file-discovery
        type: file-discovery
        parameters:
          path: /etc/epp/endpoints.yaml
          watchFile: true

      - type: queue-scorer
      - type: kv-cache-utilization-scorer
      - type: prefix-cache-scorer
      - type: no-hit-lru-scorer

      - name: metrics-source
        type: metrics-data-source
      - name: metrics-extractor
        type: core-metrics-extractor

    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: queue-scorer
            weight: 2
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
          - pluginRef: prefix-cache-scorer
            weight: 3
          - pluginRef: no-hit-lru-scorer
            weight: 2

    dataLayer:
      injectDefaults: false
      discovery:
        pluginRef: file-discovery
      sources:
        - pluginRef: metrics-source
          extractors:
            - pluginRef: metrics-extractor

---
# ConfigMap: Envoy configuration (ext_proc to EPP, ORIGINAL_DST to SGLang)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-llm-d-envoy-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sglang.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 19000

    static_resources:
      listeners:
        - name: sglang
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.llmDRouter.port }}
          per_connection_buffer_limit_bytes: 32768
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: http-{{ .Values.llmDRouter.port }}
                    route_config:
                      name: sglang
                      virtual_hosts:
                        - name: sglang-default
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: original_destination_cluster
                                timeout: 86400s
                                idle_timeout: 86400s
                                upgrade_configs:
                                  - upgrade_type: websocket
                              typed_per_filter_config:
                                envoy.filters.http.ext_proc:
                                  "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                                  config: {}
                    http_filters:
                      - name: envoy.filters.http.ext_proc
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                          grpc_service:
                            envoy_grpc:
                              cluster_name: ext_proc
                              authority: localhost:9002
                            timeout: 10s
                          processing_mode:
                            request_header_mode: SEND
                            response_header_mode: SEND
                            request_body_mode: FULL_DUPLEX_STREAMED
                            response_body_mode: FULL_DUPLEX_STREAMED
                            request_trailer_mode: SEND
                            response_trailer_mode: SEND
                          message_timeout: 1000s
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          suppress_envoy_headers: true
                    http2_protocol_options:
                      max_concurrent_streams: 100
                      initial_stream_window_size: 65536
                      initial_connection_window_size: 1048576
                    use_remote_address: true
                    normalize_path: true
                    merge_slashes: true
                    server_header_transformation: PASS_THROUGH
                    common_http_protocol_options:
                      headers_with_underscores_action: REJECT_REQUEST
                    path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT

      clusters:
        - name: original_destination_cluster
          type: ORIGINAL_DST
          connect_timeout: 1000s
          lb_policy: CLUSTER_PROVIDED
          circuit_breakers:
            thresholds:
              - max_connections: 40000
                max_pending_requests: 40000
                max_requests: 40000
          original_dst_lb_config:
            use_http_header: true
            http_header_name: x-gateway-destination-endpoint

        - name: ext_proc
          type: STATIC
          connect_timeout: 86400s
          lb_policy: LEAST_REQUEST
          circuit_breakers:
            thresholds:
              - max_connections: 40000
                max_pending_requests: 40000
                max_requests: 40000
                max_retries: 1024
          health_checks:
            - timeout: 2s
              interval: 10s
              unhealthy_threshold: 3
              healthy_threshold: 2
              reuse_connection: true
              grpc_health_check:
                service_name: "envoy.service.ext_proc.v3.ExternalProcessor"
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options:
                  initial_stream_window_size: 65536
                  initial_connection_window_size: 1048576
          load_assignment:
            cluster_name: ext_proc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9002

---
# Service — exposes Envoy sidecar (port 30001) on the SGLang pod
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-llm-d-router
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sglang.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.llmDRouter.port }}
      targetPort: {{ .Values.llmDRouter.port }}
      protocol: TCP
  selector:
    app: sglang
    {{- include "sglang.selectorLabels" . | nindent 4 }}
{{- end }}
