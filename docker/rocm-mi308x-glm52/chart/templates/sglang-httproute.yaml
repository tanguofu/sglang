{{- if .Values.gateway.enabled }}
# HTTPRoute — envoy gateway forwarding to SGLang service.
# Attaches to eg-tke Gateway in ti-cloud namespace (allowedRoutes: All).
# External access: http://<hostname> → envoy LB (21.162.215.14:80) → sglang Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-sglang
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sglang.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.gatewayName }}
      namespace: {{ .Values.gateway.gatewayNamespace }}
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          {{- if .Values.router.enabled }}
          name: {{ .Release.Name }}-router
          namespace: {{ .Values.namespace }}
          port: {{ .Values.router.port }}
          {{- else }}
          name: {{ .Release.Name }}-sglang
          namespace: {{ .Values.namespace }}
          port: {{ .Values.port }}
          {{- end }}
          weight: 1
{{- end }}
