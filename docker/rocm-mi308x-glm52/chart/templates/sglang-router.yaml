# SGLang Router — cache_aware prefix-aware load balancer across TP8 instances
# Routes requests to the worker with the highest prefix match (radix cache optimization)
# Launches via: python3 -m sglang_router.launch_router --worker-urls ... --policy cache_aware
{{- if .Values.router.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-router
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sglang.labels" . | nindent 4 }}
    app: sglang-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-router
  template:
    metadata:
      labels:
        {{- include "sglang.labels" . | nindent 8 }}
        app: sglang-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      nodeSelector:
        accelerator: amd-gpu
      terminationGracePeriodSeconds: 30
      containers:
        - name: router
          image: {{ include "sglang.image" . }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["python3", "-m", "sglang_router.launch_router"]
          args:
            - --worker-urls
            {{- range .Values.router.workerUrls }}
            - {{ . | quote }}
            {{- end }}
            - --policy
            - {{ .Values.router.policy | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.router.port | quote }}
            {{- if eq .Values.router.policy "cache_aware" }}
            - --cache-threshold
            - {{ .Values.router.cacheThreshold | quote }}
            - --balance-abs-threshold
            - {{ .Values.router.balanceAbsThreshold | quote }}
            - --balance-rel-threshold
            - {{ .Values.router.balanceRelThreshold | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.router.port }}
              protocol: TCP
          resources:
            requests:
              cpu: 2
              memory: 4Gi
            limits:
              cpu: 4
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.router.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.router.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-router
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sglang.labels" . | nindent 4 }}
    app: sglang-router
spec:
  type: ClusterIP
  selector:
    app: sglang-router
  ports:
    - name: http
      port: {{ .Values.router.port }}
      targetPort: http
      protocol: TCP
{{- end }}
