# SGLang PD Router on GZ node 172 (21.151.225.172)
# Routes requests: prefill (144:30000) → decode (132:30000)
apiVersion: v1
kind: Pod
metadata:
  name: pd-router-172
  namespace: kube-system
  labels:
    app: pd-router
    pd-role: router
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeName: node-21.151.225.172
  restartPolicy: Never
  terminationGracePeriodSeconds: 60
  imagePullSecrets:
    - name: tencent-registry
  containers:
    - name: router
      image: mirrors.tencent.com/ti-platform/sglang-glm52-308x:0710
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          echo "============================================"
          echo " SGLang Router (PD Disaggregation) - GZ RDMA"
          echo "============================================"
          echo " Prefill: http://21.151.225.144:30000"
          echo " Decode:  http://21.151.225.132:30000"
          echo " Port:    30001"
          exec python3 -m sglang_router.launch_router \
            --pd-disaggregation \
            --prefill http://21.151.225.144:30000 \
            --decode http://21.151.225.132:30000 \
            --host 0.0.0.0 --port 30001 \
            --model-path /data/model/glm52-fp8
      env:
        - name: PYTHONUNBUFFERED
          value: "1"
      securityContext:
        privileged: true
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: "4"
          memory: 4Gi
        limits:
          memory: 8Gi
  volumes:
    - name: data
      hostPath:
        path: /data
        type: Directory
