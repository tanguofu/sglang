apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations: {}
  labels:
    app.kubernetes.io/component: prefill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sglang-1p1d
    pd-role: prefill
  name: sglang-1p1d-prefill
  namespace: kube-system
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: prefill
      app.kubernetes.io/name: sglang-1p1d
  serviceName: sglang-1p1d-prefill
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-29T17:48:41+08:00'
      creationTimestamp: null
      labels:
        app.kubernetes.io/component: prefill
        app.kubernetes.io/name: sglang-1p1d
        pd-role: prefill
    spec:
      containers:
      - args:
        - "set -euo pipefail\n# Copy verified GDR engine.so (respects MC_DISABLE_HIP_TRANSPORT=1,\
          \ supports HIP dmabuf).\nif [ -f /data/mooncake-patched/engine.cpython-310-x86_64-linux-gnu.so\
          \ ]; then\n  cp /data/mooncake-patched/engine.cpython-310-x86_64-linux-gnu.so\
          \ \\\n     /opt/venv/lib/python3.10/site-packages/mooncake/engine.cpython-310-x86_64-linux-gnu.so\n\
          \  echo \"Copied verified GDR engine.so from /data/mooncake-patched/\"\n\
          else\n  echo \"ERROR: /data/mooncake-patched/engine.so not found!\" >&2\n\
          \  exit 1\nfi\n# Apply conn.py fix (GQA replication, hipSetDevice, compute_mamba_state_slice_blocks).\n\
          # MUST match prefill's conn.py version to avoid segfaults in _handle_aux_data.\n\
          if [ -f /data/mooncake-patched/conn_v0516_fixed.py ]; then\n  cp /data/mooncake-patched/conn_v0516_fixed.py\
          \ \\\n     /sgl-workspace/sglang/python/sglang/srt/disaggregation/mooncake/conn.py\n\
          \  echo \"Applied conn.py fix (GQA replication + hipSetDevice + mamba state)\
          \ from /data/mooncake-patched/\"\nelse\n  echo \"WARNING: /data/mooncake-patched/conn_v0516_fixed.py\
          \ not found!\" >&2\nfi\n# Install compatible bnxt_re driver (235.2.86.0)\
          \ for kernel ABI v8.\n# The inbox rdma-core 39.0 libbnxt_re only supports\
          \ ABI v1, causing RDMA fallback to TCP.\nif [ -f /data/mooncake-patched/libbnxt_re-235.2.86.0.so\
          \ ]; then\n  cp /data/mooncake-patched/libbnxt_re-235.2.86.0.so \\\n   \
          \  /usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so\n  ldconfig\n\
          \  echo \"Installed bnxt_re 235.2.86.0 driver (kernel ABI v8 compatible)\"\
          \nelse\n  echo \"WARNING: libbnxt_re-235.2.86.0.so not found! RDMA will\
          \ fall back to TCP\" >&2\nfi\n# Apply patched protocol.py and serving_responses.py\
          \ for PD disaggregation bootstrap support.\nif [ -f /data/mooncake-patched/protocol_v0516_patched.py\
          \ ]; then\n  cp /data/mooncake-patched/protocol_v0516_patched.py \\\n  \
          \   /sgl-workspace/sglang/python/sglang/srt/entrypoints/openai/protocol.py\n\
          \  echo \"Applied patched protocol.py (ResponsesRequest bootstrap fields)\
          \ from /data/mooncake-patched/\"\nelse\n  echo \"WARNING: /data/mooncake-patched/protocol_v0516_patched.py\
          \ not found!\" >&2\nfi\nif [ -f /data/mooncake-patched/serving_responses_v0516_patched.py\
          \ ]; then\n  cp /data/mooncake-patched/serving_responses_v0516_patched.py\
          \ \\\n     /sgl-workspace/sglang/python/sglang/srt/entrypoints/openai/serving_responses.py\n\
          \  echo \"Applied patched serving_responses.py (bootstrap field forwarding)\
          \ from /data/mooncake-patched/\"\nelse\n  echo \"WARNING: /data/mooncake-patched/serving_responses_v0516_patched.py\
          \ not found!\" >&2\nfi\necho \"=== GLM-5.2 PREFILL (MI308X, GDR via HIP\
          \ dmabuf) ===\"\n          # Install tuned aiter GEMM configs from initContainer\n\
          \          # Copy as a model_configs file (NOT replacing the source CSV)\
          \ to avoid\n          # truncating existing model_configs during aiter's\
          \ merge process.\n          if [ -s /shared/mi308x_gfx942_bf16_tuned_gemm.csv\
          \ ]; then\n            cp /shared/mi308x_gfx942_bf16_tuned_gemm.csv    \
          \            /sgl-workspace/aiter/aiter/configs/model_configs/mi308x_gfx942_bf16_tuned_gemm.csv\n\
          \            echo \"Installed tuned GEMM configs to model_configs/mi308x_gfx942_bf16_tuned_gemm.csv\"\
          \n          else\n            echo \"No tuned GEMM configs from initContainer\
          \ — using image defaults\"\n          fi\n                    # EAGLE deterministic\
          \ argmax fix baked into image (v0516-deterministic)\n          # Patch server_args.py\
          \ to allow DSA with --enable-deterministic-inference\n          # server_args.py\
          \ patch removed (not needed without --enable-deterministic-inference)\n\
          \          \n\n# === i32 overflow fix for DSA MQA logits kernel ===\nif\
          \ [ -f /data/mooncake-patched/dsa_indexer_i32fix.py ]; then\n  cp /data/mooncake-patched/dsa_indexer_i32fix.py\
          \ \\\n     /sgl-workspace/sglang/python/sglang/srt/layers/attention/dsa/dsa_indexer.py\n\
          \  echo \"Applied i32 overflow fix to dsa_indexer.py from /data/mooncake-patched/\"\
          \nelse\n  echo \"WARNING: dsa_indexer_i32fix.py not found! i32 overflow\
          \ fix not applied\" >&2\nfi\nif [ -f /data/mooncake-patched/patch_scheduler_health.py\
          \ ]; then\n  python3 /data/mooncake-patched/patch_scheduler_health.py\n\
          else\n  echo \"WARNING: patch_scheduler_health.py not found, health check\
          \ patch skipped\" >&2\nfi\n# Abort notifications must not block the scheduler\
          \ on a busy peer (zmq HWM deadlock).\npython3 /data/mooncake-patched/patch_abort_noblock.py\n\
          exec python3 -m sglang.launch_server \\\n  --model-path /data/model/glm52-fp8\
          \ \\\n  --model-impl sglang --served-model-name glm-5.2 \\\n  --tp-size\
          \ 8 --pp-size 1 --trust-remote-code \\\n  --host 0.0.0.0 --port 30000 \\\
          \n  --context-length 1048576 \\\n  --tool-call-parser glm47 --reasoning-parser\
          \ glm45 \\\n  --mem-fraction-static 0.90 \\\n  --attention-backend dsa \\\
          \n  --dsa-prefill-backend tilelang \\\n  --dsa-decode-backend tilelang \\\
          \n  --enable-aiter-allreduce-fusion \\\n  --chunked-prefill-size 8192 \\\
          \n  --enable-fused-qk-norm-rope \\\n  --schedule-conservativeness 1.0 \\\
          \n  --prefill-max-requests 32 \\\n  --max-prefill-tokens 16384 \\\n  --hicache-ratio\
          \ 4 \\\n  --kv-cache-dtype fp8_e4m3 \\\n  --disable-decode-cuda-graph \\\
          \n  --max-running-requests 32 \\\n  --disaggregation-mode prefill \\\n \
          \ --disaggregation-transfer-backend mooncake \\\n  --disaggregation-ib-device\
          \ '{\"0\":\"bnxt_re_bond0\",\"1\":\"bnxt_re_bond1\",\"2\":\"bnxt_re_bond2\"\
          ,\"3\":\"bnxt_re_bond3\",\"4\":\"bnxt_re_bond4\",\"5\":\"bnxt_re_bond5\"\
          ,\"6\":\"bnxt_re_bond6\",\"7\":\"bnxt_re_bond7\"}' \\\n  --disaggregation-bootstrap-port\
          \ 8998 \\\n  --num-reserved-decode-tokens 1024 \\\n  --enable-metrics \\\
          \n  --watchdog-timeout 7200 \\\n  --log-level info"
        command:
        - /bin/bash
        - -c
