          name: bootstrap
          protocol: TCP
        readinessProbe:
          failureThreshold: 40
          httpGet:
            path: /health
            port: 30000
            scheme: HTTP
          initialDelaySeconds: 900
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 60
        resources: {}
        securityContext:
          allowPrivilegeEscalation: true
          privileged: true
          readOnlyRootFilesystem: false
          seccompProfile:
            type: Unconfined
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
        - mountPath: /data
          name: data
        - mountPath: /dev/kfd
          name: dev-kfd
        - mountPath: /dev/dri
