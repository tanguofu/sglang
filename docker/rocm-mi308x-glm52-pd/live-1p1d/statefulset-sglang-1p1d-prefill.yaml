          value: '0'
        image: mirrors.tencent.com/ti-platform/sglang-glm52-308x:v0516-deterministic-v4
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 40
          httpGet:
            path: /health
            port: 30000
            scheme: HTTP
          initialDelaySeconds: 900
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 60
        name: sglang
        ports:
