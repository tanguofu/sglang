        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /shared
          name: shared-init
        - mountPath: /dev/kfd
          name: dev-kfd
        - mountPath: /dev/dri
          name: dev-dri
        - mountPath: /dev/infiniband
          name: dev-infiniband
      nodeName: node-21.151.225.144
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - operator: Exists
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 64Gi
        name: shm
      - hostPath:
          path: /data
          type: Directory
        name: data
      - hostPath:
