{{- $root := . }}
{{- range $i, $p := .Values.prefills }}
{{- $component := "prefill" }}
{{- if gt (int $i) 0 }}
{{- $component = printf "prefill-%d" (int $i) }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sglang-1p1d.prefillStsName" (dict "root" $root "index" $i) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    pd-role: prefill
    prefill-index: "{{ $i }}"
spec:
  serviceName: {{ include "sglang-1p1d.name" $root }}-prefill
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sglang-1p1d.name" $root }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sglang-1p1d.name" $root }}
        app.kubernetes.io/component: {{ $component }}
        pd-role: prefill
        prefill-index: "{{ $i }}"
    spec:
      hostNetwork: true
      hostIPC: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: {{ $p.nodeName }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        {{- range $root.Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      tolerations:
        - operator: Exists
      initContainers:
        - name: env-check
          image: {{ $root.Values.workerImage }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- include "sglang-1p1d.preflight" $root | nindent 14 }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" $root | nindent 12 }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" $root | nindent 12 }}
      containers:
        - name: sglang
          image: {{ $root.Values.workerImage }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== GLM-5.2 PREFILL-{{ $i }} {{ $p.ip }} (GDR + DSA tilelang + Mooncake L3) ==="
              exec python3 -m sglang.launch_server{{- include "sglang-1p1d.launchArgs" (dict "root" $root "extra" $root.Values.prefill.args) }}{{- include "sglang-1p1d.hicacheArgs" $root }}
          env:
            {{- include "sglang-1p1d.workerEnv" (dict "root" $root "hostIP" $p.ip "extra" $root.Values.prefill.extraEnv "mooncakeLocal" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: 30000
              protocol: TCP
            - name: bootstrap
              containerPort: 8998
              protocol: TCP
          {{- with $root.Values.prefill.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" $root | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 30000
              scheme: HTTP
            initialDelaySeconds: {{ $root.Values.probes.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: 30000
              scheme: HTTP
            initialDelaySeconds: {{ $root.Values.probes.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.failureThreshold }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" $root | nindent 12 }}
      volumes:
        {{- include "sglang-1p1d.workerVolumes" $root | nindent 8 }}
{{- end }}
