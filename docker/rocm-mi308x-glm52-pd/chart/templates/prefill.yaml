{{- $root := . }}
{{- range $i, $p := .Values.prefills }}
{{- $workerImage := $p.workerImage | default $root.Values.prefill.workerImage | default $root.Values.workerImage }}
{{- $component := "prefill" }}
{{- if gt (int $i) 0 }}
{{- $component = printf "prefill-%d" (int $i) }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sglang-1p1d.prefillStsName" (dict "root" $root "index" $i) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    pd-role: prefill
    prefill-index: "{{ $i }}"
spec:
  serviceName: {{ include "sglang-1p1d.prefillStsName" (dict "root" $root "index" 0) }}
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sglang-1p1d.name" $root }}
      app.kubernetes.io/component: prefill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sglang-1p1d.name" $root }}
        app.kubernetes.io/component: prefill
        pd-role: prefill
        prefill-index: "{{ $i }}"
    spec:
      hostNetwork: true
      hostIPC: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: {{ $p.nodeName }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        {{- range $root.Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      tolerations:
        - operator: Exists
      initContainers:
        - name: env-check
          image: {{ $workerImage }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- include "sglang-1p1d.preflight" $root | nindent 14 }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" $root | nindent 12 }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" $root | nindent 12 }}
      containers:
        - name: sglang
          image: {{ $workerImage }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== GLM-5.2 PREFILL-{{ $i }} {{ $p.ip }} (GDR + DSA tilelang + Mooncake L3) ==="
              {{- include "sglang-1p1d.gemmCsvInstall" $root | nindent 14 }}
              python3 /data/mooncake-patched/patch_evict_backup.py || echo "WARNING: evict-backup patch failed"
              python3 /data/mooncake-patched/patch_prefetch_log.py || echo "WARNING: prefetch-log patch failed"
              {{- if and $root.Values.mooncake.store.enabled $root.Values.mooncake.store.standalonePrefill }}
              echo "waiting for mooncake_client 127.0.0.1:{{ $root.Values.mooncake.store.port }}"
              for _ in $(seq 1 90); do
                if python3 -c "import socket; socket.create_connection(('127.0.0.1', {{ $root.Values.mooncake.store.port }}), 2).close()" 2>/dev/null; then
                  echo "mooncake_client is up"
                  break
                fi
                sleep 2
              done
              {{- end }}
              exec python3 -m sglang.launch_server{{- include "sglang-1p1d.launchArgs" (dict "root" $root "extra" $root.Values.prefill.args "port" $root.Values.ports.prefill.http "bootstrapPort" $root.Values.ports.prefill.bootstrap) }}{{- include "sglang-1p1d.hicacheArgs" $root }}
          env:
            {{- include "sglang-1p1d.workerEnv" (dict "root" $root "extra" $root.Values.prefill.extraEnv "mooncakeLocal" true "hostIP" $p.ip) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $root.Values.ports.prefill.http }}
              protocol: TCP
            - name: bootstrap
              containerPort: {{ $root.Values.ports.prefill.bootstrap }}
              protocol: TCP
          {{- with $root.Values.prefill.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" $root | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $root.Values.ports.prefill.http }}
              scheme: HTTP
            initialDelaySeconds: {{ $root.Values.probes.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $root.Values.ports.prefill.http }}
              scheme: HTTP
            initialDelaySeconds: {{ $root.Values.probes.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.failureThreshold }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" $root | nindent 12 }}
        {{- if $root.Values.mooncake.store.enabled }}
        {{- include "sglang-1p1d.mooncakeStoreSidecar" (dict "root" $root "hostIP" $p.ip "role" (printf "prefill-%d" (int $i)) "segmentSize" $root.Values.mooncake.store.prefillSegmentSize "memoryLimit" "80Gi") | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "sglang-1p1d.workerVolumes" $root | nindent 8 }}
{{- end }}
