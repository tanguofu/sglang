apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sglang-ts4-1p1d-prefill
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sglang-ts4-1p1d
    app.kubernetes.io/component: prefill
    pd-role: prefill
spec:
  serviceName: sglang-ts4-1p1d-prefill
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sglang-ts4-1p1d
      app.kubernetes.io/component: prefill
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sglang-ts4-1p1d
        app.kubernetes.io/component: prefill
        pd-role: prefill
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: {{ .Values.prefill.nodeName }}
      tolerations:
{{ toYaml .Values.tolerations | indent 6 }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 6 }}
      initContainers:
      {{- include "sglang.init.routes" (dict "ctx" . "routes" .Values.rdma.routesPrefill) | nindent 6 }}
      containers:
      - name: sglang
        image: "{{ .Values.image.sglang }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          # Verify RDMA devices are visible (image ships libbnxt_re 238.x for ts4 kernel ABI)
          ibv_devinfo 2>&1 | grep -E "^hca_id|transport" | head -20 || true
          # Copy verified GDR engine.so from host (md5 c3873f547d5f0b46f20979009808fa91).
          # The fix-eagle-coredump-v3 image ships an older engine.so (md5 d192b213)
          # that ignores MC_DISABLE_HIP_TRANSPORT=1 — must be replaced for GDR.
          # Also install libbnxt_re 238.1.138.5 for ts4 bnxt_re fw 238.x.
          # The stock 235.2.86.0 doesn't support fw 238.x. Must create symlink in
          # libibverbs driver dir (stock driver is disabled as .so-inbox).
          # Do NOT patch conn.py — the container's original conn.py works correctly.
          if [ -f /data/mooncake-patched/engine.cpython-310-x86_64-linux-gnu.so ]; then
            cp /data/mooncake-patched/engine.cpython-310-x86_64-linux-gnu.so \
               /opt/venv/lib/python3.10/site-packages/mooncake/engine.cpython-310-x86_64-linux-gnu.so
            echo "Copied verified GDR engine.so from /data/mooncake-patched/"
          else
            echo "ERROR: /data/mooncake-patched/engine.so not found!" >&2
            exit 1
          fi
          if [ -f /data/mooncake-patched/libbnxt_re-rdmav34.so ]; then
            cp /data/mooncake-patched/libbnxt_re-rdmav34.so /usr/local/lib/libbnxt_re-rdmav34.so
            ln -sf /usr/local/lib/libbnxt_re-rdmav34.so \
                   /usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so
            ldconfig
            echo "Installed libbnxt_re 238.1.138.5 + symlink in libibverbs dir"
          else
            echo "WARN: /data/mooncake-patched/libbnxt_re-rdmav34.so not found"
          fi
          echo "=== GLM-5.2 PREFILL (MI308X, GDR via HIP dmabuf) ==="
          exec python3 -m sglang.launch_server \
            --model-path {{ .Values.model.path }} \
            --model-impl sglang --served-model-name {{ .Values.model.name }} \
            {{- if .Values.apiKey }}
            --api-key {{ .Values.apiKey }} \
            {{- end }}
            --tp-size {{ .Values.sglang.tpSize }} --pp-size {{ .Values.sglang.ppSize }} --trust-remote-code \
            --host 0.0.0.0 --port {{ .Values.prefill.port }} \
            --context-length {{ .Values.model.contextLength }} \
            --tool-call-parser {{ .Values.sglang.toolCallParser }} --reasoning-parser {{ .Values.sglang.reasoningParser }} \
            --mem-fraction-static {{ .Values.sglang.memFractionStatic }} \
            {{- if .Values.sglang.attentionBackend }}
            --attention-backend {{ .Values.sglang.attentionBackend }} \
            {{- end }}
            {{- if .Values.sglang.dsaPrefillBackend }}
            --dsa-prefill-backend {{ .Values.sglang.dsaPrefillBackend }} \
            {{- end }}
            {{- if .Values.sglang.dsaDecodeBackend }}
            --dsa-decode-backend {{ .Values.sglang.dsaDecodeBackend }} \
            {{- end }}
            {{- if .Values.sglang.moeRunnerBackend }}
            --moe-runner-backend {{ .Values.sglang.moeRunnerBackend }} \
            {{- end }}
            {{- if .Values.sglang.enableAiterAllreduceFusion }}
            --enable-aiter-allreduce-fusion \
            {{- end }}
            --chunked-prefill-size {{ .Values.sglang.prefill.chunkedPrefillSize }} \
            {{- if .Values.sglang.enableFusedQkNormRope }}
            --enable-fused-qk-norm-rope \
            {{- end }}
            {{- if .Values.sglang.enableMixedChunk }}
            --enable-mixed-chunk \
            {{- end }}
            --schedule-conservativeness {{ .Values.sglang.scheduleConservativeness }} \
            --prefill-max-requests {{ .Values.sglang.prefill.prefillMaxRequests }} \
            --max-prefill-tokens {{ .Values.sglang.prefill.maxPrefillTokens }} \
            --kv-cache-dtype {{ .Values.sglang.kvCacheDtype }} \
            {{- if .Values.sglang.prefill.disablePrefillCudaGraph }}
            --disable-prefill-cuda-graph \
            {{- else }}
            --cuda-graph-bs-prefill {{ .Values.sglang.prefill.cudaGraphBsPrefill }} \
            {{- end }}
            --max-running-requests {{ .Values.sglang.prefill.maxRunningRequests | default .Values.sglang.maxRunningRequests }} \
            --disaggregation-mode prefill \
            --disaggregation-transfer-backend mooncake \
            --disaggregation-ib-device '{{ .Values.rdma.ibDeviceMap }}' \
            --disaggregation-bootstrap-port {{ .Values.rdma.bootstrapPort }} \
            --num-reserved-decode-tokens {{ .Values.sglang.numReservedDecodeTokens }} \
            {{- if .Values.sglang.disableOverlapSchedule }}
            --disable-overlap-schedule \
            {{- end }}
            {{- if .Values.sglang.enableMetrics }}
            --enable-metrics \
            {{- end }}
            {{- if .Values.sglang.skipServerWarmup }}
            --skip-server-warmup \
            {{- end }}
            --watchdog-timeout {{ .Values.sglang.watchdogTimeout }} \
            --log-level {{ .Values.sglang.logLevel }}
        env:
        {{- $root := . -}}
        {{- include "sglang.env.common" (dict "ctx" $root "hostIP" .Values.prefill.hostIP) | nindent 8 }}
        ports:
        - containerPort: {{ .Values.prefill.port }}
          name: http
        - containerPort: {{ .Values.rdma.bootstrapPort }}
          name: bootstrap
        resources:
{{ toYaml .Values.resources.gpuNode | indent 10 }}
        securityContext:
          privileged: true
          capabilities:
            add: ["SYS_PTRACE", "IPC_LOCK", "SYS_ADMIN"]
          seccompProfile:
            type: Unconfined
        volumeMounts:
        {{- include "sglang.volumeMounts.rdma" . | nindent 8 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.prefill.port }}
          initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.failureThreshold }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.prefill.port }}
          initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.periodSeconds }}
          timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
          failureThreshold: {{ .Values.probes.failureThreshold }}
      volumes:
      {{- include "sglang.volumes.rdma" . | nindent 6 }}
