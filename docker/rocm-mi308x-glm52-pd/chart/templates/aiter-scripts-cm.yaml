{{- if eq (include "sglang-1p1d.aiterScriptsEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sglang-1p1d.name" . }}-aiter-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" . | nindent 4 }}
    app.kubernetes.io/component: aiter-scripts
data:
  gen_bf16_gate_indexer.py: |
{{ .Files.Get "files/gen_bf16_gate_indexer.py" | indent 4 }}
  patch_paged_flydsl_native.py: |
{{ .Files.Get "files/patch_paged_flydsl_native.py" | indent 4 }}
  enable_paged_flydsl.py: |
{{ .Files.Get "files/enable_paged_flydsl.py" | indent 4 }}
  flydsl_fp8_mqa_logits.py: |
{{ .Files.Get "files/flydsl_fp8_mqa_logits.py" | indent 4 }}
  flydsl_init.py: |
{{ .Files.Get "files/flydsl_init.py" | indent 4 }}
{{- end }}
