apiVersion: v1
kind: Service
metadata:
  name: {{ include "sglang-1p1d.name" . }}-prefill
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" . | nindent 4 }}
    app.kubernetes.io/component: prefill
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "sglang-1p1d.name" . }}
    app.kubernetes.io/component: prefill
  ports:
    - name: http
      port: 30000
      targetPort: 30000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sglang-1p1d.name" . }}-decode
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" . | nindent 4 }}
    app.kubernetes.io/component: decode
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "sglang-1p1d.name" . }}
    app.kubernetes.io/component: decode
  ports:
    - name: http
      port: 30000
      targetPort: 30000
      protocol: TCP
