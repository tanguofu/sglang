apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sglang-1p1d.name" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
    pd-role: router
spec:
  replicas: 1
  # Recreate = kill the old pod first, then start the new one.
  # RollingUpdate + maxSurge spawned extra eklet NodePorts replicas on this
  # hostNetwork / nodeName-pinned router. Do not switch back.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sglang-1p1d.name" . }}
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sglang-1p1d.name" . }}
        app.kubernetes.io/component: router
        pd-role: router
    spec:
      hostNetwork: {{ .Values.router.hostNetwork | default true }}
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: {{ .Values.router.nodeName }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      # GPU nodes are tainted dedicated=sglang-1pd-*-group:NoSchedule.
      # nodeName skips the scheduler but kubelet still admits on taints.
      # Missing this is what left hostNetwork pods in NodePorts and
      # spawned the leftover storm. Same as mooncake-master / workers.
      tolerations:
        - operator: Exists
      containers:
        - name: router
          image: {{ .Values.routerImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              cp /dev/shm/sglang_router_rs.abi3.so /opt/venv/lib/python3.12/site-packages/sglang_router/sglang_router_rs.abi3.so 2>/dev/null || true
              echo "=== SGLang PD Router ==="
              exec python3 -m sglang_router.launch_router \
                --pd-disaggregation \
                {{- range $i, $p := .Values.prefills }}
                --prefill http://{{ $p.ip }}:{{ $.Values.ports.prefill.http }} {{ $.Values.ports.prefill.bootstrap }} \
                {{- end }}
                {{- range $i, $d := .Values.decodes }}
                --decode http://{{ $d.ip }}:{{ $.Values.ports.decode.http }} \
                {{- end }}
                --host 0.0.0.0 --port {{ .Values.router.port }} \
                --prometheus-port {{ .Values.router.metricsPort }} \
                --model-path {{ .Values.modelPath }} \
                --api-key {{ .Values.apiKey }} \
                --health-check-timeout-secs 30 \
                --health-check-interval-secs 5 \
                --health-failure-threshold 5 \
                --health-success-threshold 2 \
                --prefill-policy {{ .Values.router.prefillPolicy | default "round_robin" }} \
                --decode-policy {{ .Values.router.decodePolicy | default "round_robin" }} \
                --balance-abs-threshold {{ .Values.router.balanceAbsThreshold | default 0 }} \
                --balance-rel-threshold {{ .Values.router.balanceRelThreshold | default 1.5 }} \
                --cb-timeout-duration-secs {{ .Values.router.cbTimeoutSecs | default 60 }} \
                --log-level info
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: {{ .Values.router.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.router.metricsPort }}
              protocol: TCP
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.router.port }}
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.router.port }}
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sglang-1p1d.name" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "sglang-1p1d.name" . }}
    app.kubernetes.io/component: router
  ports:
    - name: http
      port: {{ .Values.router.port }}
      targetPort: {{ .Values.router.port }}
      protocol: TCP
    - name: metrics
      port: {{ .Values.router.metricsPort }}
      targetPort: {{ .Values.router.metricsPort }}
      protocol: TCP
