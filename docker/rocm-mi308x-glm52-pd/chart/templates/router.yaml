apiVersion: v1
kind: Pod
metadata:
  name: pd-router-172
  namespace: kube-system
  labels:
    app: pd-router
    pd-role: router
spec:
  hostNetwork: true
  restartPolicy: Always
  nodeName: {{ .Values.routerNode }}
  containers:
  - name: router
    image: {{ .Values.routerImage }}
    imagePullPolicy: Always
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -euo pipefail
      echo "=== SGLang PD Router (3 APIs: chat/responses/messages) ==="
      exec python3 -m sglang_router.launch_router \
        --pd-disaggregation \
        --prefill http://{{ .Values.prefillIP }}:30000 {{ .Values.bootstrapPort }} \
        --decode http://{{ .Values.decodeIP }}:30000 \
        --host 0.0.0.0 --port 30001 \
        --prometheus-port 19097 \
        --model-path {{ .Values.modelPath }} \
        --health-check-timeout-secs 60 \
        --health-check-interval-secs 30 \
        --health-failure-threshold 10 \
        --health-success-threshold 2 \
        --cb-timeout-duration-secs 300 \
        --log-level info
    securityContext:
      privileged: true
      capabilities:
        add: ["SYS_PTRACE", "IPC_LOCK", "NET_ADMIN"]
        drop: ["ALL"]
      seccompProfile:
        type: Unconfined
    resources:
      limits:
        memory: 8Gi
      requests:
        cpu: "4"
        memory: 4Gi
    env:
    - name: PYTHONUNBUFFERED
      value: "1"
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    hostPath:
      path: /data
      type: Directory
  tolerations:
  - operator: Exists
