{{- $root := . }}
{{- range $i, $d := .Values.decodes }}
{{- $workerImage := $d.workerImage | default $root.Values.decode.workerImage | default $root.Values.workerImage }}
{{- $args := $d.args | default $root.Values.decode.args }}
{{- $extraEnv := $d.extraEnv | default $root.Values.decode.extraEnv }}
{{- $component := "decode" }}
{{- if gt (int $i) 0 }}
{{- $component = printf "decode-%d" (int $i) }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sglang-1p1d.decodeStsName" (dict "root" $root "index" $i) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    pd-role: decode
    decode-index: "{{ $i }}"
spec:
  serviceName: {{ include "sglang-1p1d.decodeStsName" (dict "root" $root "index" $i) }}
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sglang-1p1d.name" $root }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sglang-1p1d.name" $root }}
        app.kubernetes.io/component: {{ $component }}
        pd-role: decode
        decode-index: "{{ $i }}"
    spec:
      hostNetwork: true
      hostIPC: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: {{ $d.nodeName }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        {{- range $root.Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      tolerations:
        - operator: Exists
      initContainers:
        - name: env-check
          image: {{ $workerImage }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- include "sglang-1p1d.preflight" $root | nindent 14 }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" $root | nindent 12 }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" $root | nindent 12 }}
      containers:
        - name: sglang
          image: {{ $workerImage }}
          imagePullPolicy: {{ $root.Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== GLM-5.2 DECODE-{{ $i }} {{ $d.ip }} (MI308X, baked GDR + DSA tilelang + NEXTN) ==="
              {{- include "sglang-1p1d.gemmCsvInstall" $root | nindent 14 }}
              exec python3 -m sglang.launch_server{{- include "sglang-1p1d.launchArgs" (dict "root" $root "extra" $args "port" $root.Values.ports.decode.http "bootstrapPort" $root.Values.ports.decode.bootstrap) }}
          env:
            {{- include "sglang-1p1d.workerEnv" (dict "root" $root "extra" $extraEnv "hostIP" $d.ip) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $root.Values.ports.decode.http }}
              protocol: TCP
            - name: bootstrap
              containerPort: {{ $root.Values.ports.decode.bootstrap }}
              protocol: TCP
          resources:
            {{- toYaml $root.Values.decode.resources | nindent 12 }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" $root | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $root.Values.ports.decode.http }}
              scheme: HTTP
            initialDelaySeconds: {{ $root.Values.probes.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $root.Values.ports.decode.http }}
              scheme: HTTP
            initialDelaySeconds: {{ $root.Values.probes.initialDelaySeconds }}
            periodSeconds: {{ $root.Values.probes.periodSeconds }}
            timeoutSeconds: {{ $root.Values.probes.timeoutSeconds }}
            failureThreshold: {{ $root.Values.probes.failureThreshold }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" $root | nindent 12 }}
        {{- if $root.Values.mooncake.store.enabled }}
        {{- include "sglang-1p1d.mooncakeStoreSidecar" (dict "root" $root "hostIP" $d.ip "role" (printf "decode-%d" (int $i)) "segmentSize" $root.Values.mooncake.store.decodeSegmentSize "memoryLimit" "300Gi") | nindent 8 }}
        {{- end }}
      volumes:
        {{- include "sglang-1p1d.workerVolumes" $root | nindent 8 }}
{{- end }}
