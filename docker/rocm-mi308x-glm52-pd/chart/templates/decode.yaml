apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sglang-1p1d.name" . }}-decode
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sglang-1p1d.labels" . | nindent 4 }}
    app.kubernetes.io/component: decode
    pd-role: decode
spec:
  serviceName: {{ include "sglang-1p1d.name" . }}-decode
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sglang-1p1d.name" . }}
      app.kubernetes.io/component: decode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sglang-1p1d.name" . }}
        app.kubernetes.io/component: decode
        pd-role: decode
    spec:
      hostNetwork: true
      hostIPC: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeName: {{ .Values.decodeNode }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      tolerations:
        - operator: Exists
      initContainers:
        - name: env-check
          image: {{ .Values.workerImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              {{- include "sglang-1p1d.preflight" . | nindent 14 }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" . | nindent 12 }}
      containers:
        - name: sglang
          image: {{ .Values.workerImage }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "=== GLM-5.2 DECODE (MI308X, baked GDR + DSA tilelang + NEXTN 2/3) ==="
              exec python3 -m sglang.launch_server{{- include "sglang-1p1d.launchArgs" (dict "root" . "extra" .Values.decode.args) }}
          env:
            {{- include "sglang-1p1d.workerEnv" (dict "root" . "hostIP" .Values.decodeIP) | nindent 12 }}
          ports:
            - name: http
              containerPort: 30000
              protocol: TCP
            - name: bootstrap
              containerPort: 8998
              protocol: TCP
          resources:
            {{- toYaml .Values.decode.resources | nindent 12 }}
          securityContext:
            {{- include "sglang-1p1d.securityContext" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 30000
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: 30000
              scheme: HTTP
            initialDelaySeconds: {{ .Values.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.failureThreshold }}
          volumeMounts:
            {{- include "sglang-1p1d.workerVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "sglang-1p1d.workerVolumes" . | nindent 8 }}
