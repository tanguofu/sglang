# GLM-5.2-FP8 PD Prefill on MI308X node 152 (NODE_PREFILL_1_IP, bond0 26.24.42.114)
# bnxt_re RoCE + mooncake (MC_DISABLE_HIP_TRANSPORT=1) + host staging
apiVersion: v1
kind: Pod
metadata:
  name: pd-prefill-152
  namespace: kube-system
  labels:
    app: pd-prefill
    pd-role: prefill
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeName: node-NODE_PREFILL_1_IP
  restartPolicy: Never
  terminationGracePeriodSeconds: 300
  imagePullSecrets:
    - name: tencent-registry
  containers:
    - name: sglang-prefill
      image: YOUR_REGISTRY/your-project/sglang-glm52-308x-pd:latest
      imagePullPolicy: Always
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail
          # Use image's built-in mooncake@01d1eb2a + patched sglang (ABI-matched).
          # Do NOT overwrite with /data/mooncake-patched/ (built for the old 0710
          # image; ABI mismatch caused rdma_context lkey/rkey-not-found aborts).
          exec python3 -m sglang.launch_server \
            --model-path /data/model/glm52-fp8 \
            --model-impl sglang --served-model-name glm-5.2 \
            --tp-size 8 --pp-size 1 --trust-remote-code \
            --host 0.0.0.0 --port 30000 \
            --context-length 1048576 \
            --tool-call-parser glm47 --reasoning-parser glm45 \
            --mem-fraction-static 0.88 \
            --enable-aiter-allreduce-fusion --enable-mixed-chunk \
            --chunked-prefill-size 32768 --enable-fused-qk-norm-rope \
            --schedule-conservativeness 0.5 \
            --prefill-max-requests 32 --max-prefill-tokens 65536 \
            --kv-cache-dtype fp8_e4m3 \
            --max-running-requests 32 \
            --num-continuous-decode-steps 1 \
            --disaggregation-mode prefill \
            --disaggregation-transfer-backend mori \
            --disaggregation-ib-device '{"0":"bnxt_re_bond0","1":"bnxt_re_bond1","2":"bnxt_re_bond2","3":"bnxt_re_bond3","4":"bnxt_re_bond4","5":"bnxt_re_bond5","6":"bnxt_re_bond6","7":"bnxt_re_bond7"}' \
            --disaggregation-bootstrap-port 8998 \
            --num-reserved-decode-tokens 1024 \
            --disable-overlap-schedule \
            --enable-metrics --skip-server-warmup \
            --watchdog-timeout 3600 --log-level info
      env:
        - name: HIP_VISIBLE_DEVICES
          value: "0,1,2,3,4,5,6,7"
        - name: PYTORCH_ROCM_ARCH
          value: "gfx942"
        - name: NCCL_DEBUG
          value: "INFO"
        - name: HSA_ENABLE_SDMA
          value: "0"
        - name: HIP_FORCE_DEV_KERNARG
          value: "1"
        - name: HSA_NO_SCRATCH_RECLAIM
          value: "1"
        - name: NCCL_CUMEM_ENABLE
          value: "0"
        - name: NCCL_MIN_NCHANNELS
          value: "112"
        - name: NCCL_NVLS_ENABLE
          value: "0"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: "expandable_segments:True"
        - name: ROCM_QUICK_REDUCE_QUANTIZATION
          value: "INT8"
        - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
          value: "1"
        - name: SGLANG_DISABLE_CUDNN_CHECK
          value: "1"
        - name: SGLANG_ENABLE_PCG_DSV2_DUAL_STREAM
          value: "1"
        - name: SGLANG_INT4_WEIGHT
          value: "0"
        - name: SGLANG_MOE_PADDING
          value: "1"
        - name: SGLANG_ROCM_DISABLE_LINEARQUANT
          value: "0"
        - name: SGLANG_ROCM_FUSED_DECODE_MLA
          value: "1"
        - name: SGLANG_SET_CPU_AFFINITY
          value: "1"
        - name: SGLANG_USE_AITER
          value: "1"
        - name: SGLANG_USE_ROCM700A
          value: "1"
        - name: SGLANG_OPT_USE_TOPK_V2
          value: "0"
        - name: MC_DISABLE_HIP_TRANSPORT
          value: "1"
        - name: MC_GID_INDEX
          value: "3"
        - name: NCCL_IB_GID_INDEX
          value: "3"
        - name: MORI_DISABLE_AUTO_XGMI
          value: "1"
        - name: SGLANG_HOST_IP
          value: "26.24.42.114"
        - name: SGLANG_PD_HOST_STAGING
          value: "1"
      securityContext:
        privileged: true
        capabilities:
          add: ["SYS_PTRACE"]
          drop: ["ALL"]
        seccompProfile:
          type: Unconfined
      ports:
        - name: http
          containerPort: 30000
          hostPort: 30000
          protocol: TCP
      volumeMounts:
        - name: data
          mountPath: /data
        - name: dev-kfd
          mountPath: /dev/kfd
        - name: dev-dri
          mountPath: /dev/dri
        - name: ib
          mountPath: /dev/infiniband
        - name: shm
          mountPath: /dev/shm
      resources:
        requests:
          cpu: "360"
          memory: 2000Gi
          amd.com/gpu: 8
        limits:
          amd.com/gpu: 8
  volumes:
    - name: data
      hostPath:
        path: /data
        type: Directory
    - name: dev-kfd
      hostPath:
        path: /dev/kfd
        type: CharDevice
    - name: dev-dri
      hostPath:
        path: /dev/dri
        type: Directory
    - name: ib
      hostPath:
        path: /dev/infiniband
        type: Directory
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
