# Service + HTTPRoute for A-group PD router (pd-router-144 on 21.151.225.144:30002)
# Service: headless-ish, points at the router pod (hostNetwork, port 30002)
# HTTPRoute: glm52-pd-a.jmpti.woa.com → eg-tke Gateway → this Service → router
---
apiVersion: v1
kind: Service
metadata:
  name: pd-router-a-svc
  namespace: kube-system
  labels:
    app: pd-router
    pd-role: router
spec:
  selector:
    app: pd-router
    pd-role: router
  ports:
    - name: http
      port: 30002
      targetPort: 30002
      protocol: TCP
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: glm52-pd-a
  namespace: kube-system
  labels:
    app: pd-router
    pd-group: A
spec:
  hostnames:
    - "glm52-pd-a.jmpti.woa.com"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-tke
      namespace: ti-cloud
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: pd-router-a-svc
          namespace: kube-system
          port: 30002
          weight: 1
