# SGLang Service — ClusterIP for in-cluster discovery.
# With hostNetwork enabled, the pod is directly reachable at <nodeIP>:30000.
# This Service provides a stable DNS name for in-cluster clients.
apiVersion: v1
kind: Service
metadata:
  name: sglang-glm52
  namespace: kube-system
  labels:
    app: sglang
    accelerator: amd-gpu
spec:
  type: ClusterIP
  selector:
    app: sglang
  ports:
    - name: http
      port: 30000
      targetPort: http
      protocol: TCP
---
# Headless Service for StatefulSet (required by StatefulSet spec)
apiVersion: v1
kind: Service
metadata:
  name: sglang-glm52-headless
  namespace: kube-system
  labels:
    app: sglang
    accelerator: amd-gpu
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: sglang
  ports:
    - name: http
      port: 30000
      targetPort: http
      protocol: TCP
