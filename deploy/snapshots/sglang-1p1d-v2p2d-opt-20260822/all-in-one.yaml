          \necho \"Hostname:  $(hostname)\"\necho \"\"\n\n# 1. GPU Detection\necho \"--- GPU Detection ---\"\nGPU_COUNT=$(rocminfo\
          \ 2>/dev/null | grep -c \"^  Name:.*gfx\" || true)\necho \"GPU count: ${GPU_COUNT}\"\nif [ \"${GPU_COUNT}\" -lt\
          \ 1 ]; then\n  echo \"FATAL: No GPU detected via rocminfo\" >&2\n  exit 1\nfi\nrocminfo 2>/dev/null | grep -E \"\
          Marketing Name:|Name:.*gfx|Compute Unit:\" | head -12\necho \"\"\n\n# 2. Driver Version\necho \"--- Driver Version\
          \ ---\"\nrocm-smi --showdriverversion 2>&1 | grep -i \"driver version\" || echo \"(unable to query driver version)\"\
          \necho \"\"\n\n# 3. Firmware Version (GPU 0 only)\necho \"--- Firmware Version (GPU 0) ---\"\nrocm-smi --showfwinfo\
          \ 2>&1 | grep \"GPU\\[0\\]\" | head -10 || echo \"(unable to query firmware info)\"\necho \"\"\n\n# 4. VRAM Occupancy\n\
          echo \"--- VRAM Occupancy ---\"\nrocm-smi --showmeminfo vram 2>&1 | grep -E \"GPU\\[|VRAM Total\" | head -20\nVRAM_USED=$(rocm-smi\
          \ --showmeminfo vram 2>&1 | grep \"GPU\\[0\\].*Used\" | awk '{print $NF}' || true)\nVRAM_TOTAL=$(rocm-smi --showmeminfo\
          \ vram 2>&1 | grep \"GPU\\[0\\].*Total Memory\" | awk '{print $NF}' || true)\nif [ -n \"${VRAM_USED}\" ] && [ -n\
          \ \"${VRAM_TOTAL}\" ] && [ \"${VRAM_TOTAL}\" -gt 0 ] 2>/dev/null; then\n  VRAM_PCT=$((VRAM_USED * 100 / VRAM_TOTAL))\n\
          \  echo \"GPU[0] VRAM usage: ${VRAM_PCT}% (${VRAM_USED} / ${VRAM_TOTAL} bytes)\"\n  if [ \"${VRAM_PCT}\" -gt 50\
          \ ]; then\n    echo \"WARNING: VRAM occupancy ${VRAM_PCT}% > 50% before sglang start \u2014 possible stale process\"\
          \ >&2\n  fi\nelse\n  echo \"(unable to parse VRAM usage)\"\nfi\necho \"\"\n\n# 5. Host Memory\necho \"--- Host Memory\
          \ ---\"\nfree -h | head -3\nMEM_AVAIL_KB=$(grep MemAvailable /proc/meminfo | awk '{print $2}')\nMEM_TOTAL_KB=$(grep\
          \ MemTotal /proc/meminfo | awk '{print $2}')\nif [ \"${MEM_TOTAL_KB}\" -gt 0 ] 2>/dev/null; then\n  MEM_PCT=$((\
          \ (MEM_TOTAL_KB - MEM_AVAIL_KB) * 100 / MEM_TOTAL_KB ))\n  echo \"Host memory usage: ${MEM_PCT}% (${MEM_AVAIL_KB}\
          \ KB available / ${MEM_TOTAL_KB} KB total)\"\n  if [ \"${MEM_PCT}\" -gt 80 ]; then\n    echo \"WARNING: Host memory\
          \ usage ${MEM_PCT}% > 80%\" >&2\n  fi\nelse\n  echo \"(unable to parse host memory)\"\nfi\necho \"\"\n\n# 6. IB\
          \ Device Status\necho \"--- IB Device Status ---\"\nibv_devinfo 2>&1 | grep -E \"hca_id|transport|fw_ver|state|link_layer\"\
          \ | head -40 || echo \"(ibv_devinfo not available)\"\nIB_ACTIVE=$(ibv_devinfo 2>&1 | grep -c \"PORT_ACTIVE\" ||\
          \ true)\necho \"Active IB ports: ${IB_ACTIVE}\"\nif [ \"${IB_ACTIVE}\" -lt 1 ]; then\n  echo \"WARNING: No active\
          \ IB ports detected \u2014 PD transfer will fall back to TCP\" >&2\nfi\necho \"\"\n\n# 7. Model File Check\necho\
          \ \"--- Model File Check ---\"\nMODEL_PATH=\"/data/model/glm52-fp8\"\nif [ ! -d \"${MODEL_PATH}\" ]; then\n  echo\
          \ \"FATAL: Model directory ${MODEL_PATH} not found\" >&2\n  exit 1\nfi\nif [ ! -f \"${MODEL_PATH}/config.json\"\
          \ ]; then\n  echo \"FATAL: ${MODEL_PATH}/config.json missing\" >&2\n  exit 1\nfi\necho \"Model path: ${MODEL_PATH}\"\
          \nls -la \"${MODEL_PATH}/config.json\"\nls \"${MODEL_PATH}/\"*.safetensors 2>/dev/null | head -5 || echo \"(no .safetensors\
          \ files found)\"\nMODEL_SIZE=$(du -sh \"${MODEL_PATH}\" 2>/dev/null | awk '{print $1}')\necho \"Model size: ${MODEL_SIZE}\"\
          \necho \"\"\n\n# 8. GEMM CSV: extract ONLY newly-tuned gfx942 K=6144 entries to a model_configs file\n# IMPORTANT:\n\
          # - Do NOT replace the image's source CSV \u2014 that causes aiter's merge process to\n#   truncate all model_configs/*.csv\
          \ files to 0 rows.\n# - Do NOT include ALL gfx942 entries \u2014 many already exist in other model_configs\n#  \
          \ (glm5, dsv3, etc.) and duplicates cause RuntimeError on import.\n# - ONLY include the shapes we actually tuned:\
          \ gfx942 with K=6144 (N=256 and N=32).\n#   These were missing from all existing configs and caused \"not found\
          \ tuned config\"\n#   warnings at runtime.\necho \"--- aiter GEMM CSV ---\"\nSRC_CSV=\"/data/aiter_configs/bf16_tuned_gemm.csv\"\
          \nOUT_CSV=\"/shared/mi308x_gfx942_bf16_tuned_gemm.csv\"\nif [ -f \"${SRC_CSV}\" ]; then\n  # Extract ONLY genuinely\
          \ new gfx942 K=6144 entries that don't already exist\n  # in the image's model_configs files. The aiter merge process\
          \ raises\n  # RuntimeError on duplicate shape keys, so we must filter them out here.\n  python3 << 'PYEOF'\nimport\
          \ csv, glob, os, sys\n\nsrc = \"/data/aiter_configs/bf16_tuned_gemm.csv\"\nout = \"/shared/mi308x_gfx942_bf16_tuned_gemm.csv\"\
          \nconfigs_dir = \"/sgl-workspace/aiter/aiter/configs/model_configs\"\n\n# Collect existing shape keys (first 10\
          \ fields) from all model_configs CSVs\nexisting_keys = set()\nfor f in glob.glob(os.path.join(configs_dir, \"*.csv\"\
          )):\n    try:\n        with open(f, newline='') as fh:\n            reader = csv.reader(fh)\n            next(reader,\
          \ None)\n            for row in reader:\n                if len(row) >= 10:\n                    existing_keys.add(tuple(row[:10]))\n\
          \    except Exception:\n        pass\n\ncount = 0\ntotal = 0\nwith open(src, newline='') as fin, open(out, 'w',\
          \ newline='') as fout:\n    reader = csv.reader(fin)\n    writer = csv.writer(fout)\n    try:\n        header =\
          \ next(reader)\n        writer.writerow(header)\n    except StopIteration:\n        sys.exit(0)\n    for row in\
          \ reader:\n        if len(row) >= 10 and row[0] == \"gfx942\" and row[4] == \"6144\":\n            total += 1\n\
          \            if tuple(row[:10]) not in existing_keys:\n                writer.writerow(row)\n                count\
          \ += 1\n\nprint(f\"Extracted {count} new gfx942 K=6144 entries (of {total} total, {total - count} duplicates filtered)\"\
          )\nPYEOF\n  TOTAL_ROWS=$(wc -l < \"${OUT_CSV}\")\n  echo \"Wrote ${TOTAL_ROWS} lines (including header) to ${OUT_CSV}\"\
          \nelse\n  echo \"WARNING: ${SRC_CSV} not found \u2014 will use image default configs\" >&2\n  touch \"${OUT_CSV}\"\
          \  # empty sentinel so main container knows\nfi\necho \"\"\n\n# 9. Mooncake patched files check\necho \"--- Mooncake\
          \ Patched Files ---\"\nMC_DIR=\"/data/mooncake-patched\"\nif [ -d \"${MC_DIR}\" ]; then\n  ls -la \"${MC_DIR}/\"\
          \ | head -10\nelse\n  echo \"WARNING: ${MC_DIR} not found \u2014 main container will fail\" >&2\nfi\necho \"\"\n\
          \necho \"========== Pre-Flight Check Complete ==========\"\n"
        command:
        - /bin/bash
        - -c
